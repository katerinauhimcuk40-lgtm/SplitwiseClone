name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SplitwiseClone.slnx

      - name: Build
        run: dotnet build SplitwiseClone.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test SplitwiseClone.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Coverage summary
        if: always()
        run: |
          file=$(find TestResults -name 'coverage.cobertura.xml' | head -n 1)
          if [ -n "$file" ]; then
            rate=$(grep -o 'line-rate="[0-9.]*"' "$file" | head -n 1 | grep -o '[0-9.]*')
            echo "### Code coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Line coverage: $(awk "BEGIN { printf \"%.1f\", $rate * 100 }")%" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage report not found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: warn

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag splitwise-api:${{ github.sha }} .

  deploy:
    name: Deploy to Render
    # Деплой лише для push у main і лише після успішних тестів та збірки образу
    needs: [ build-and-test, docker-build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL не задано (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Деплой запущено для коміту ${GITHUB_SHA}"

      - name: Smoke test (очікуємо нову версію на /version і 200 на /health)
        env:
          API_URL: ${{ vars.API_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::Змінну репозиторію API_URL не задано — smoke test пропущено"
            exit 0
          fi
          API_URL="${API_URL%/}"
          for attempt in $(seq 1 40); do
            body=$(curl --silent --max-time 30 "$API_URL/version" || true)
            echo "[$attempt/40] /version -> $body"
            if echo "$body" | grep -q "$EXPECTED_SHA"; then
              curl --fail --silent --show-error --max-time 30 "$API_URL/health"
              echo
              echo "✅ Нова версія працює: $API_URL"
              echo "### Deployed ✅" >> "$GITHUB_STEP_SUMMARY"
              echo "$API_URL/swagger — commit \`$EXPECTED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Нова версія не з'явилась за 10 хвилин"
          exit 1
